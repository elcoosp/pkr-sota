name: golden

on:
  pull_request:
    paths:
      - 'crates/pkr-cfr/**'
      - 'crates/pkr-abstraction/**'
      - 'crates/pkr-eval/**'
      - 'crates/pkr-core/**'
      - 'crates/pkr-export/**'
      - 'crates/pkr-contracts/**'
      - 'binaries/pkr-trainer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/golden-training.sha256'
      - 'ci/scripts/golden-training.sh'
      - '.github/workflows/golden.yml'
  workflow_dispatch:

# Cancel in-progress runs on the same ref.
concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: golden-release
          cache-targets: true

      # The golden check needs the smoke abstraction. Generate it once
      # at this workflow's cost; it's ~30s on a CI runner.
      # 2026-11-03 re-audit (M8): this was a third distinct smoke-cache
      # key scheme (hashFiles of ci/cache-key.sh + crates/**), so it
      # never shared artifacts with smoke.yml/bench.yml. Normalize to
      # the same cache-key.sh-derived key + restore-keys and keep the
      # generate-on-miss step.
      - name: Compute smoke cache key
        id: key
        run: echo "k=$(./ci/cache-key.sh)" >> $GITHUB_OUTPUT

      - name: Restore smoke artifacts
        id: smoke-cache
        uses: actions/cache@v4
        with:
          path: outputs/v0-smoke
          key: smoke-abstractions-${{ runner.os }}-${{ steps.key.outputs.k }}
          restore-keys: |
            smoke-abstractions-${{ runner.os }}-

      - name: Generate smoke abstraction
        if: steps.smoke-cache.outputs.cache-hit != 'true'
        run: bash smoke.sh

      - name: Golden training check
        run: bash ci/scripts/golden-training.sh
