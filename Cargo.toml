[workspace]
members = [
    "crates/pkr-contracts",
    "crates/pkr-core",
    "crates/pkr-cfr",
    "crates/pkr-eval",
    "crates/pkr-abstraction",
    "crates/pkr-export",
    "crates/pkr-runtime",
    "crates/pkr-testgames",
    "binaries/pkr-trainer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["pkr-sota"]

[workspace.dependencies]
pkr-contracts = { path = "crates/pkr-contracts" }
pkr-core = { path = "crates/pkr-core" }
pkr-cfr = { path = "crates/pkr-cfr" }
pkr-eval = { path = "crates/pkr-eval" }
pkr-abstraction = { path = "crates/pkr-abstraction" }
pkr-export = { path = "crates/pkr-export" }
pkr-runtime = { path = "crates/pkr-runtime" }
pkr-testgames = { path = "crates/pkr-testgames" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
dashmap = "6"
papaya = "0.1"
foldhash = "0.1"
rand = "0.10"
rand_xoshiro = "0.6"
rayon = "1.10"
tracing = "0.1"
thiserror = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
