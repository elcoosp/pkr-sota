[workspace]
members = [
    "crates/pkr-contracts",
    "crates/pkr-core",
    "crates/pkr-cfr",
    "crates/pkr-eval",
    "crates/pkr-abstraction",
    "crates/pkr-export",
    "crates/pkr-runtime",
    "crates/pkr-fuzz",
    "crates/pkr-exploit",
    "crates/pkr-testgames",
    "binaries/pkr-trainer",
    "benches/pkr_contracts_bench",
    "benches/pkr_core_bench",
    "benches/pkr_eval_bench",
    "benches/pkr_runtime_bench",
    "benches/pkr_cfr_bench",
    "benches/pkr_abstraction_bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["pkr-sota"]

[workspace.dependencies]
pkr-contracts = { path = "crates/pkr-contracts" }
pkr-core = { path = "crates/pkr-core" }
pkr-cfr = { path = "crates/pkr-cfr" }
pkr-eval = { path = "crates/pkr-eval" }
pkr-abstraction = { path = "crates/pkr-abstraction" }
pkr-export = { path = "crates/pkr-export" }
pkr-runtime = { path = "crates/pkr-runtime" }
pkr-fuzz = { path = "crates/pkr-fuzz" }
pkr-exploit = { path = "crates/pkr-exploit" }
pkr-testgames = { path = "crates/pkr-testgames" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
dashmap = "6"
papaya = "0.1"
foldhash = "0.1"
rand = "0.10"
rand_xoshiro = "0.6"
rayon = "1.10"
tracing = "0.1"
thiserror = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# B4: criterion lives here (not in [workspace.dev-dependencies]) because
# `criterion = { workspace = true }` in a member's [dev-dependencies]
# resolves against [workspace.dependencies] on this toolchain; a
# dev-dependencies-only entry produced "unused manifest key" warnings
# and failed workspace resolution.
criterion = { version = "0.5", features = ["html_reports", "cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

# Anti-pattern #3: benches build without LTO so micro-bench numbers
# reflect codegen comparable to dev iteration, not release distortion.
[profile.bench]
opt-level = 3
lto = "off"
codegen-units = 1
debug = false
