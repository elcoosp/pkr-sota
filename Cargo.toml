[workspace]
resolver = "3"
members = [
    "crates/pkr-contracts",
    "crates/pkr-core",
    "crates/pkr-eval",
    "crates/pkr-abstraction",
    "crates/pkr-cfr",
    "crates/pkr-export",
    "crates/pkr-runtime",
    "binaries/pkr-trainer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["pkr-sota contributors"]

[workspace.dependencies]
# Internal crates
pkr-contracts = { path = "crates/pkr-contracts" }
pkr-core = { path = "crates/pkr-core" }
pkr-eval = { path = "crates/pkr-eval" }
pkr-abstraction = { path = "crates/pkr-abstraction" }
pkr-cfr = { path = "crates/pkr-cfr" }
pkr-export = { path = "crates/pkr-export" }
pkr-runtime = { path = "crates/pkr-runtime" }

# Core Serialization & Memory
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.21", features = ["derive"] }
memmap2 = "0.9"
thiserror = "2.0"

# Concurrency & Randomness (Crucial for CFR/AMX)
rayon = "1.10"
rand = "0.9"  # Updated to 0.9

# Logging & CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# Fast Hashing (For training-time maps before FMph export)
foldhash = "0.1"
